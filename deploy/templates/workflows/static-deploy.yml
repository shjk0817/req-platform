# ============================================================
# 模板：静态站点构建与发布
# 使用：复制到项目仓库 .gitea/workflows/static-deploy.yml，
#       并把 __DEPLOY_TARGET__ 替换为静态产物发布目录
# 说明：不使用外网 Action，全部用 shell 完成，适配内网环境
# ============================================================
name: Static Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        env:
          # Gitea 内置仓库令牌，用于拉取私有仓库
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SERVER="${GITHUB_SERVER_URL#*//}"
          URL="http://oauth2:${REPO_TOKEN}@${SERVER}/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "${URL}"
          # 按提交拉取，兼容分支推送与 PR（PR 场景的 ref_name 是 PR 编号）
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          echo "当前提交: $(git rev-parse --short HEAD)"

      - name: 构建静态产物
        run: |
          npm ci || npm install
          npm run build

      - name: 发布产物
        run: |
          TARGET="__DEPLOY_TARGET__/${GITHUB_REPOSITORY##*/}"
          mkdir -p "${TARGET}"
          # 按项目实际输出目录调整 dist
          cp -r dist/. "${TARGET}/"
          echo "已发布到 ${TARGET}"
