; ============================================================
; Gitea 参考配置
; 注意：Gitea 实际读取的是数据卷内的 /data/gitea/conf/app.ini（首次启动自动生成），
;      本文件只用于说明「应该开启哪些行为配置」，运行时以下两处为准：
;        1. docker-compose.yml 中 gitea 服务的 GITEA__<section>__<key> 环境变量（优先级最高）
;        2. 数据卷内自动生成的 app.ini
;      也就是说：改这里不会生效，改 docker-compose.yml 才会生效。
; ============================================================

APP_NAME = 内部需求协作平台 Git 服务
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /data/gitea

[server]
PROTOCOL = http
HTTP_PORT = 3000
DISABLE_SSH = false
START_SSH_SERVER = true
LFS_START_SERVER = true
OFFLINE_MODE = true
; 允许通过反向代理访问
ENABLE_PROXY_PROTOCOL = false
; 匿名用户访问首页时直接进入登录页（内部平台不对外展示仓库列表）
LANDING_PAGE = login

[repository]
ROOT = /data/git/repositories
; 默认分支统一为 main
DEFAULT_BRANCH = main
; 允许在平台上直接创建模板仓库
ENABLE_PUSH_CREATE_USER = false

[ui]
; 使用仓库内 custom/public/assets/css/theme-aimanager.css
DEFAULT_THEME = aimanager
THEMES = gitea,arc-green,aimanager

[repository.pull-request]
DEFAULT_MERGE_STYLE = merge
; 允许合并前压缩提交
DEFAULT_ALLOW_SQUASH_MERGE = true
; 合并后自动删除分支
DEFAULT_DELETE_BRANCH_AFTER_MERGE = true

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
ENABLE_NOTIFY_MAIL = true
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = false
ENABLE_BASIC_AUTHENTICATION = true
; ---------- 免密登录（平台 SSO）----------
; 由 Caddy 的 forward_auth 校验平台登录态后，把用户名放进 X-Gitea-User 请求头，
; Gitea 信任该请求头并自动完成登录；首次出现的新用户会自动登记。
ENABLE_REVERSE_PROXY_AUTHENTICATION = true
ENABLE_REVERSE_PROXY_AUTO_REGISTRATION = true
ENABLE_REVERSE_PROXY_EMAIL = true
REVERSE_PROXY_AUTHENTICATION_USER = X-Gitea-User
REVERSE_PROXY_AUTHENTICATION_EMAIL = X-Gitea-Email

[actions]
ENABLED = true
; actions 模板源：github 表示使用 GitHub 上的 action 仓库
DEFAULT_ACTIONS_URL = github
; 单个任务的日志保留
LOG_RETENTION_DAYS = 30

[webhook]
ALLOWED_HOST_LIST = *
SKIP_TLS_VERIFY = true
DELIVER_TIMEOUT = 15

[lfs]
PATH = /data/git/lfs

[mailer]
ENABLED = false

[log]
MODE = console
LEVEL = Info
ROOT_PATH = /data/gitea/log

[security]
INSTALL_LOCK = true
; 密码哈希算法
PASSWORD_HASH_ALGO = pbkdf2
MIN_PASSWORD_LENGTH = 8
