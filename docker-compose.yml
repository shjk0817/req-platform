# ============================================================
# 内部需求协作平台 - 单机 Docker Compose 编排
# 包含：PostgreSQL / Redis / Gitea / Gitea act_runner / 平台后端 / 平台前端 / Caddy
# ============================================================
name: aimanager

services:
  # ---------------- 数据库：PostgreSQL（平台与 Gitea 共用实例，分库） ----------------
  postgres:
    image: postgres:16-alpine
    container_name: aimanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 供 init-databases.sh 创建 Gitea 独立数据库
      GITEA_DB_NAME: ${GITEA_DB_NAME}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # ---------------- 一次性任务：创建 Gitea 独立数据库 ----------------
  # 说明：不使用 postgres 镜像的 initdb.d 目录，因为 Docker Desktop 下
  #       挂载进来的 .sh 无法直接 exec；这里显式以 `sh 脚本` 方式执行，行为更可控
  db-init:
    image: postgres:16-alpine
    container_name: aimanager-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      GITEA_DB_NAME: ${GITEA_DB_NAME:-gitea}
    volumes:
      - ./deploy/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["/bin/sh", "/init-databases.sh"]
    networks:
      - backend

  # ---------------- 缓存与任务队列：Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: aimanager-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ---------------- Git 底座：Gitea（仓库 / PR / Issue / 代码评审 / Actions） ----------------
  gitea:
    image: gitea/gitea:1.22
    container_name: aimanager-gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: ${TZ:-Asia/Shanghai}
      # 数据库连接（环境变量优先级高于 app.ini）
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${POSTGRES_USER}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      # 对外访问地址
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: "22"
      # 安全：禁止开放注册，账号由平台或管理员创建
      GITEA__service__DISABLE_REGISTRATION: "true"
      # 内部平台：匿名用户只看到登录页，不展示仓库列表
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__security__INSTALL_LOCK: "true"
      # 首页落地页：匿名访问直接进登录页（配合自定义登录页引导回平台）
      GITEA__server__LANDING_PAGE: login
      # 使用 deploy/gitea/custom/public/assets/css/theme-aimanager.css
      GITEA__ui__DEFAULT_THEME: aimanager
      GITEA__ui__THEMES: gitea,arc-green,aimanager
      # 免密登录（平台 SSO）：信任 Caddy forward_auth 透传的用户名请求头
      GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "true"
      GITEA__service__ENABLE_REVERSE_PROXY_EMAIL: "true"
      # 注意：请求头名称属于 [security] 段，写在 [service] 段会被 Gitea 忽略（退回默认 X-WEBAUTH-*）
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_USER: X-Gitea-User
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_EMAIL: X-Gitea-Email
      # 开启 Actions（CI/CD）
      GITEA__actions__ENABLED: "true"
      # 使用内置的 actions 模板源标识（Gitea 1.22 起不再接受完整 URL）
      GITEA__actions__DEFAULT_ACTIONS_URL: "github"
      # Webhook 允许回调本平台容器
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
      GITEA__webhook__SKIP_TLS_VERIFY: "true"
      GITEA__cron__ENABLED: "true"
      GITEA__log__LEVEL: Info
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # 仓库模板目录（供 init.sh 通过 gitea CLI 导入模板仓库使用）
      - ./deploy/templates:/templates:ro
      # 品牌定制（只读挂载，不干扰 /data 下的数据、配置与会话目录）
      #   templates/ 覆盖 Gitea 默认模板（登录页引导回需求协作平台）
      #   public/    覆盖站点 logo 与 favicon
      - ./deploy/gitea/custom/templates:/data/gitea/templates:ro
      - ./deploy/gitea/custom/public:/data/gitea/public:ro
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - backend

  # ---------------- CI/CD 执行器：Gitea act_runner ----------------
  gitea-runner:
    image: gitea/act_runner:latest
    container_name: aimanager-gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      # 由 deploy/gitea/init.sh 生成后写入 deploy/runner/.registration-token
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /registration-token
      GITEA_RUNNER_NAME: aimanager-runner
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest,ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
      CONFIG_FILE: /config.yaml
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./deploy/runner/config.yaml:/config.yaml:ro
      - ./deploy/runner/.registration-token:/registration-token:ro
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

  # ---------------- 平台后端：NestJS API ----------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aimanager-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "4000"
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # 开发环境账号选择器只返回 ACTIVE 账号与开发密码，生产环境接口会拒绝
      NODE_ENV: ${NODE_ENV:-production}
      DEV_USER_PICKER_ENABLED: ${DEV_USER_PICKER_ENABLED:-false}
      DEV_PICKER_ADMIN_PASSWORD: ${DEV_PICKER_ADMIN_PASSWORD:-Admin@123456}
      DEV_PICKER_USER_PASSWORD: ${DEV_PICKER_USER_PASSWORD:-Demo@123456}
      # 初始管理员（仅在平台无任何管理员时创建）
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aimanager.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      ADMIN_NAME: ${ADMIN_NAME:-平台管理员}
      # Gitea 容器内网地址（服务端调用）
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_ROOT_URL: ${GITEA_ROOT_URL}
      GITEA_ORG: ${GITEA_ORG}
      GITEA_API_TOKEN: ${GITEA_API_TOKEN}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET}
      # 流水线状态回调令牌（留空时后端自动复用 GITEA_WEBHOOK_SECRET）
      CI_CALLBACK_TOKEN: ${CI_CALLBACK_TOKEN:-}
      # 平台对外地址
      APP_URL: ${APP_URL}
      API_PUBLIC_URL: ${API_URL}
      # 容器内部回调地址：Gitea Webhook 直接回调后端容器，避免走公网与 TLS
      SELF_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      # 附件与图片存储目录（由 uploads-data 卷持久化）
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      AVATAR_MAX_MB: ${AVATAR_MAX_MB:-5}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # 需求图片与附件落盘目录（与容器同生命周期，重建不丢数据）
      - uploads-data:/app/uploads
    networks:
      - backend

  # ---------------- 远程 MCP：供标准 MCP 客户端调用平台能力 ----------------
  agent-mcp:
    build:
      context: ./apps/agent-tools
      dockerfile: Dockerfile
    container_name: aimanager-agent-mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      AIMANAGER_API_URL: http://api:4000/api
      AIMANAGER_GITEA_URL: ${GITEA_ROOT_URL}
      AIM_MCP_PORT: ${AIM_MCP_PORT:-4100}
    networks:
      - backend

  # ---------------- 平台前端：Next.js ----------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_DEV_USER_PICKER: ${DEV_USER_PICKER_ENABLED:-false}
        NEXT_PUBLIC_UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
        NEXT_PUBLIC_AVATAR_MAX_MB: ${AVATAR_MAX_MB:-5}
    container_name: aimanager-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
      # 浏览器通过同域 /api 访问后端（由 Caddy 转发）
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_DEV_USER_PICKER: ${DEV_USER_PICKER_ENABLED:-false}
      NEXT_PUBLIC_UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      NEXT_PUBLIC_AVATAR_MAX_MB: ${AVATAR_MAX_MB:-5}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      APP_URL: ${APP_URL}
    networks:
      - backend

  # ---------------- 反向代理与 TLS：Caddy ----------------
  caddy:
    image: caddy:2-alpine
    container_name: aimanager-caddy
    restart: unless-stopped
    depends_on:
      - web
      - gitea
    environment:
      APP_ADDR: ${APP_ADDR:-app.localhost}
      GITEA_ADDR: ${GITEA_ADDR:-git.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      # 若宿主机 80/443 已被占用（例如已有 Nginx），可通过环境变量改端口
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      # Gitea 站点独立端口（平台上不同端口=不同站点，且浏览器 Cookie 不区分端口，
      # 因此统一用同一主机访问时平台登录态可以直接带到 Git 服务）
      - "${CADDY_GITEA_HTTP_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  gitea-data:
  runner-data:
  caddy-data:
  caddy-config:
  uploads-data:

networks:
  backend:
    driver: bridge
